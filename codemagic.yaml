workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 30
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Memory Palace ASC

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ai.thememorypalace.app
      node: 20
      vars:
        BUNDLE_ID: ai.thememorypalace.app

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Sync Capacitor iOS
        script: |
          mkdir -p out
          echo '<!DOCTYPE html><html><body>Loading...</body></html>' > out/index.html
          npx cap sync ios

      - name: Copy app icons
        script: |
          cp -r memory-palace-ios-build/icons/* ios/App/App/Assets.xcassets/AppIcon.appiconset/

      - name: Add entitlements
        script: |
          cat > ios/App/App/App.entitlements << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
            <key>com.apple.developer.associated-domains</key>
            <array>
              <string>applinks:thememorypalace.ai</string>
            </array>
          </dict>
          </plist>
          PLIST

      - name: Patch AppDelegate with splash safety net
        script: |
          # Force-dismiss Capacitor splash screen after 6 seconds at the native level.
          # This guarantees the splash hides even if the WebView never fires a load event
          # (e.g. slow network at Apple review).
          DELEGATE="ios/App/App/AppDelegate.swift"
          cat > "$DELEGATE" << 'SWIFT'
          import UIKit
          import WebKit
          import Capacitor

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {

              var window: UIWindow?

              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  // Native safety net: force-remove splash overlay after 6s
                  // even if WebView hasn't loaded (e.g. slow network at Apple Review).
                  DispatchQueue.main.asyncAfter(deadline: .now() + 6.0) { [weak self] in
                      self?.forceHideSplash()
                  }
                  return true
              }

              /// Removes any non-WKWebView subviews from the root view controller.
              /// The Capacitor SplashScreen plugin adds a UIView overlay; this strips it.
              private func forceHideSplash() {
                  guard let vc = window?.rootViewController else { return }
                  for subview in vc.view.subviews where !(subview is WKWebView) {
                      UIView.animate(withDuration: 0.3, animations: {
                          subview.alpha = 0
                      }) { _ in
                          subview.removeFromSuperview()
                      }
                  }
              }

              func application(_ app: UIApplication, open url: URL,
                               options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {
                  return ApplicationDelegateProxy.shared.application(app, open: url, options: options)
              }

              func application(_ application: UIApplication,
                               continue userActivity: NSUserActivity,
                               restorationHandler: @escaping ([UIUserActivityRestoring]?) -> Void) -> Bool {
                  return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)
              }

              func application(_ application: UIApplication,
                               didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication,
                               didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          }
          SWIFT

      - name: Add camera permissions
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Take photos for your memory palace'" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Choose photos for your memory palace'" $PLIST 2>/dev/null || true

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild build -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            archive

      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --archive-path $CM_BUILD_DIR/App.xcarchive

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
