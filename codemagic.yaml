workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 30
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Memory Palace ASC

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ai.thememorypalace.app
      node: 20
      vars:
        BUNDLE_ID: ai.thememorypalace.app

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Sync Capacitor iOS
        script: |
          mkdir -p out
          echo '<!DOCTYPE html><html><body>Loading...</body></html>' > out/index.html
          cat > out/error.html << 'ERRORPAGE'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
            <title>The Memory Palace</title>
            <style>
              *{margin:0;padding:0;box-sizing:border-box}
              body{background:#F2EDE4;font-family:-apple-system,system-ui,sans-serif;
                   display:flex;align-items:center;justify-content:center;height:100vh;
                   color:#5C4A32}
              .wrap{text-align:center;padding:2rem}
              .spinner{width:40px;height:40px;margin:0 auto 1.5rem;
                       border:3px solid #D4C5A9;border-top-color:#8B7355;
                       border-radius:50%;animation:spin .8s linear infinite}
              @keyframes spin{to{transform:rotate(360deg)}}
              h1{font-size:1.25rem;font-weight:600;margin-bottom:.5rem}
              p{font-size:.875rem;color:#8B7355;margin-bottom:1rem}
              button{background:#8B7355;color:#fff;border:none;padding:.75rem 1.5rem;
                     border-radius:.5rem;font-size:.875rem;cursor:pointer}
              .hidden{display:none}
            </style>
          </head>
          <body>
            <div class="wrap">
              <div class="spinner" id="sp"></div>
              <h1>The Memory Palace</h1>
              <p id="msg">Connecting...</p>
              <div id="fail" class="hidden">
                <p>Could not connect. Please check your internet connection.</p>
                <button onclick="location.href='https://www.thememorypalace.ai'">Try Again</button>
              </div>
            </div>
            <script>
              (function(){
                var URL='https://www.thememorypalace.ai';
                var MAX=3, DELAY=3000, attempt=0;
                function tryLoad(){
                  attempt++;
                  document.getElementById('msg').textContent='Connecting (attempt '+attempt+'/'+MAX+')...';
                  fetch(URL,{method:'HEAD',mode:'no-cors'}).then(function(){
                    location.href=URL;
                  }).catch(function(){
                    if(attempt<MAX){
                      setTimeout(tryLoad,DELAY);
                    }else{
                      document.getElementById('sp').classList.add('hidden');
                      document.getElementById('msg').classList.add('hidden');
                      document.getElementById('fail').classList.remove('hidden');
                    }
                  });
                }
                setTimeout(tryLoad,DELAY);
              })();
            </script>
          </body>
          </html>
          ERRORPAGE
          npx cap sync ios

      - name: Copy app icons
        script: |
          cp -r memory-palace-ios-build/icons/* ios/App/App/Assets.xcassets/AppIcon.appiconset/

      - name: Add entitlements
        script: |
          cat > ios/App/App/App.entitlements << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
            <key>com.apple.developer.associated-domains</key>
            <array>
              <string>applinks:thememorypalace.ai</string>
              <string>applinks:www.thememorypalace.ai</string>
              <string>webcredentials:thememorypalace.ai</string>
              <string>webcredentials:www.thememorypalace.ai</string>
            </array>
          </dict>
          </plist>
          PLIST

      - name: Add camera permissions
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Take photos for your memory palace'" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Choose photos for your memory palace'" $PLIST 2>/dev/null || true

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild build -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            archive

      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --archive-path $CM_BUILD_DIR/App.xcarchive

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
